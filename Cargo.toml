[package]
name = "waffle"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
colored_json = "5.0.0"
derive-new = "0.7.0"
derive_more = { version = "2.1.1", features = ["display"] }
either = "1.19.0"
itertools = "0.15.0"
jq = "0.1.0"
lazy_static = "1.5.1"
map_tuple = "0.1.3"
openapiv3-extended = { version = "6.0.1" }
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["blocking", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = {version="1.0.150", features=["raw_value"]}
serde_yaml = "0.9.34"
sysdirs = "0.9.4"
thiserror = "2.0.21"
typetag = "0.2.23"
